- name: Kazuo Igarashi Shihan
  rank: "8th Dan"
  title: "Technical Director"
  bio: "Born in 1946, Igarashi Shihan began Aikido in 1964 at Meiji University. One of the leading uchi-deshi at Kobayashi Dojos from 1973, he established the Aikido Igarashi Dojo in the Tokyo area in 1983. He now teaches at six dojos and conducts international seminars, regularly visiting Calgary to lead workshops."
  photo: ""

- name: Arran Fisher
  rank: "5th Dan"
  title: "Dojo-cho"
  bio: "Training since 1995 under Inaba Sensei, Arran was promoted to 5th Dan in 2024 with the support of Igarashi Shihan. He holds a degree in philosophy and creative writing, and is also a musician, music producer, and sound technician. As Dojo-cho, he oversees dojo membership and operations management."
  photo: ""

- name: Chris Hayward
  rank: "6th Dan"
  title: "Senior Instructor"
  bio: "Chris began training with Inaba Shihan in 1996 and served as Dojo-cho for 20 years. He has trained in Japan and Hawai'i. His interests include soccer, travel, music, and photography. In January 2026, he was presented with his 6th Dan promotion certificate."
  photo: ""

- name: Shane Fielder
  rank: "5th Dan"
  title: "Senior Instructor"
  bio: "Shane began training in 1994 in Edmonton and has attended seminars across North America. He moved to Calgary in 2009, previously affiliated with Northern Alberta Aikikai."
  photo: ""

- name: Andrew Barron
  rank: "5th Dan"
  title: "Senior Instructor"
  bio: "Born in England and now retired in Canmore, Alberta, Andrew achieved shodan (black belt) in 2006. He received his 5th Dan certificate in January 2026. His passion outside of aikido is photography (andrewbarron.ca)."
  photo: ""

- name: Beau Calvez
  rank: "4th Dan"
  title: "Instructor"
  bio: "Training since 1999, Beau specializes in ukemi (receiving techniques). His interests include hiking, cooking, and cultural travel."
  photo: ""
